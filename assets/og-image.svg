<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="og-title">
  <title id="og-title">Garage Sale — Saturday, August 22, 8 AM to 4 PM, 55 Bradley Boulevard, Neepawa MB. Scan the QR code for the map and directions.</title>

  <defs>
    <linearGradient id="ogbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFBF3"/>
      <stop offset="1" stop-color="#FCE7CB"/>
    </linearGradient>
    <pattern id="ogdots" width="44" height="44" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="3.6" fill="#E4572E" opacity="0.10"/>
      <circle cx="30" cy="30" r="3.6" fill="#126E73" opacity="0.10"/>
    </pattern>
    <linearGradient id="ogbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#122A31"/>
      <stop offset="1" stop-color="#17363F"/>
    </linearGradient>
    <style>
      .disp { font-family: "Lato Black", Lato, "Arial Black", "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 900; }
      .body { font-family: Lato, "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 700; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#ogbg)"/>
  <rect width="1200" height="630" fill="url(#ogdots)"/>

  <!-- Bunting -->
  <g>
    <path d="M40 46 Q 600 96 1160 46" fill="none" stroke="#2B2118" stroke-width="5" stroke-linecap="round"/>
    <path d="M64 52 L116 58 L88 110 Z" fill="#E4572E"/>
    <path d="M148 63 L200 69 L172 121 Z" fill="#FFC145"/>
    <path d="M232 73 L284 77 L256 129 Z" fill="#126E73"/>
    <path d="M316 80 L368 84 L340 136 Z" fill="#2F7D4F"/>
    <path d="M400 85 L452 88 L424 140 Z" fill="#E4572E"/>
    <path d="M484 89 L536 90 L508 142 Z" fill="#FFC145"/>
    <path d="M568 91 L620 92 L592 144 Z" fill="#126E73"/>
    <path d="M652 92 L704 91 L676 143 Z" fill="#2F7D4F"/>
    <path d="M748 90 L800 88 L772 140 Z" fill="#E4572E"/>
    <path d="M832 86 L884 83 L856 135 Z" fill="#2F7D4F"/>
    <path d="M916 81 L968 76 L940 128 Z" fill="#E4572E"/>
    <path d="M1000 73 L1052 66 L1024 118 Z" fill="#FFC145"/>
    <path d="M1084 62 L1136 53 L1108 105 Z" fill="#126E73"/>
  </g>

  <!-- Headline -->
  <text class="disp" x="600" y="270" text-anchor="middle" font-size="104" fill="#17363F" letter-spacing="1">GARAGE</text>
  <g transform="rotate(-2 600 358)">
    <text class="disp" x="605" y="392" text-anchor="middle" font-size="140" fill="#FFC145">SALE!</text>
    <text class="disp" x="600" y="387" text-anchor="middle" font-size="140" fill="#E4572E">SALE!</text>
  </g>

  <!-- ============ INFO BAR ACROSS THE FOOT ============
       The QR code lives here, with the line that tells people what it is
       for. Anyone seeing this picture on Facebook can point a camera at it
       and land on the website. -->
  <g>
    <rect x="0" y="428" width="1200" height="202" fill="url(#ogbar)"/>

    <!-- QR code, on a white card so a phone camera can find it easily -->
    <rect x="44" y="452" width="156" height="156" rx="12" fill="#FFFFFF"/>
    <image href="garage-sale-qr.png" xlink:href="garage-sale-qr.png"
           x="54" y="462" width="136" height="136" preserveAspectRatio="xMidYMid meet"/>

    <text class="disp" x="232" y="506" font-size="40" fill="#FFFFFF">SATURDAY, AUGUST 22  ·  8 AM – 4 PM</text>
    <text class="disp" x="232" y="552" font-size="34" fill="#FFC145">55 BRADLEY BOULEVARD, NEEPAWA MB</text>
    <text class="body" x="232" y="594" font-size="25" fill="#A9C3CB" letter-spacing="1">SCAN THE QR CODE FOR THE MAP &amp; DIRECTIONS</text>
  </g>
</svg>
