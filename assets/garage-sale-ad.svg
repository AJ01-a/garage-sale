<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="ad-title ad-desc">
  <title id="ad-title">Garage Sale — Saturday, August 22, 8 AM to 4 PM, 55 Bradley Boulevard, Neepawa MB</title>
  <desc id="ad-desc">Colourful garage sale advertisement with flag bunting, the date and time, the street address, and a QR code to scan for the map, directions and a live countdown.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFBF3"/>
      <stop offset="1" stop-color="#FCE7CB"/>
    </linearGradient>
    <pattern id="dots" width="46" height="46" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="4" fill="#E4572E" opacity="0.10"/>
      <circle cx="31" cy="31" r="4" fill="#126E73" opacity="0.10"/>
    </pattern>
    <style>
      .disp { font-family: "Lato Black", Lato, "Arial Black", "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 900; }
      .body { font-family: Lato, "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 700; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" fill="url(#dots)"/>
  <rect x="26" y="26" width="1148" height="1148" rx="46" fill="none" stroke="#2B2118" stroke-width="8"/>
  <rect x="46" y="46" width="1108" height="1108" rx="34" fill="none" stroke="#E4572E" stroke-width="4" stroke-dasharray="16 14"/>

  <!-- Bunting across the top -->
  <g>
    <path d="M70 92 Q 600 152 1130 92" fill="none" stroke="#2B2118" stroke-width="6" stroke-linecap="round"/>
    <g>
      <path d="M92 97 L152 104 L120 164 Z" fill="#E4572E"/>
      <path d="M182 110 L242 116 L210 176 Z" fill="#FFC145"/>
      <path d="M272 120 L332 125 L300 185 Z" fill="#126E73"/>
      <path d="M362 127 L422 131 L390 191 Z" fill="#2F7D4F"/>
      <path d="M452 132 L512 135 L480 195 Z" fill="#E4572E"/>
      <path d="M542 135 L602 136 L570 196 Z" fill="#FFC145"/>
      <path d="M632 135 L692 133 L660 193 Z" fill="#126E73"/>
      <path d="M722 132 L782 128 L750 188 Z" fill="#2F7D4F"/>
      <path d="M812 126 L872 120 L840 180 Z" fill="#E4572E"/>
      <path d="M902 117 L962 109 L930 169 Z" fill="#FFC145"/>
      <path d="M992 106 L1052 96 L1020 156 Z" fill="#126E73"/>
    </g>
  </g>

  <!-- Headline -->
  <text class="disp" x="600" y="336" text-anchor="middle" font-size="132" fill="#17363F" letter-spacing="2">GARAGE</text>
  <g transform="rotate(-2.2 600 500)">
    <text class="disp" x="606" y="518" text-anchor="middle" font-size="186" fill="#FFC145">SALE</text>
    <text class="disp" x="600" y="512" text-anchor="middle" font-size="186" fill="#E4572E">SALE</text>
  </g>

  <!-- Date banner -->
  <g>
    <path d="M108 552 L1092 552 L1092 670 L108 670 Z" fill="#17363F"/>
    <path d="M108 552 L60 611 L108 670 Z" fill="#122A31"/>
    <path d="M1092 552 L1140 611 L1092 670 Z" fill="#122A31"/>
    <text class="disp" x="600" y="604" text-anchor="middle" font-size="48" fill="#FFFFFF" letter-spacing="1">SATURDAY</text>
    <text class="disp" x="600" y="656" text-anchor="middle" font-size="48" fill="#FFC145" letter-spacing="1">AUGUST 22, 2026</text>
  </g>

  <!-- Time -->
  <text class="disp" x="600" y="756" text-anchor="middle" font-size="80" fill="#2B2118">8:00 AM – 4:00 PM</text>

  <!-- Divider -->
  <g stroke="#E4572E" stroke-width="6" stroke-linecap="round">
    <line x1="430" y1="794" x2="770" y2="794"/>
  </g>

  <!-- Address -->
  <g>
    <text class="disp" x="600" y="856" text-anchor="middle" font-size="62" fill="#17363F">55 BRADLEY BOULEVARD</text>
    <text class="disp" x="600" y="910" text-anchor="middle" font-size="52" fill="#126E73">NEEPAWA, MB</text>
  </g>

  <!-- ============ QR PANEL ============
       The whole point of this picture is that somebody scrolling Facebook
       can hold their phone up to it. The code and the sentence explaining
       what it does have to sit together, big enough to read on a phone. -->
  <g>
    <rect x="176" y="944" width="848" height="188" rx="24" fill="#17363F"/>
    <rect x="200" y="966" width="144" height="144" rx="12" fill="#FFFFFF"/>
    <image href="garage-sale-qr.png" xlink:href="garage-sale-qr.png"
           x="210" y="976" width="124" height="124" preserveAspectRatio="xMidYMid meet"/>

    <text class="disp" x="372" y="1010" font-size="37" fill="#FFC145">SCAN FOR THE MAP</text>
    <text class="disp" x="372" y="1052" font-size="37" fill="#FFFFFF">&amp; DIRECTIONS</text>
    <text class="body" x="372" y="1092" font-size="23" fill="#A9C3CB" letter-spacing="1">Plus a live countdown to the sale</text>
  </g>
</svg>
