
name: Deploy website to GitHub Pages

# Runs every time you push to the main branch,
# and can also be started by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions GitHub Pages needs in order to publish.
permissions:
  contents: read
  pages: write
  id-token: write

# If you push twice quickly, let the newest one win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get the files
        uses: actions/checkout@v4

      - name: Set up Pages
        uses: actions/configure-pages@v5
        with:
          # Switches GitHub Pages on automatically the first time this runs,
          # so there is nothing to click in the repository settings.
          enablement: true

      - name: Package the website
        uses: actions/upload-pages-artifact@v3
        with:
          # The whole project folder is the website (it is plain HTML/CSS/JS).
          path: '.'

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
